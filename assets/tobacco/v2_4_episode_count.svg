<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">V2.4 Episode Count per Trial</title><desc id="desc">Five paper trials produced 1,1,2,2,1 episodes while five cigarette trials produced 3 episodes each. The smoking classification threshold is 3 episodes.</desc><rect width="900" height="520" rx="24" fill="#081222"/><text x="450" y="46" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="24" font-weight="700">V2.4 Episode Count per Trial</text><text x="450" y="76" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="14">Paper vs cigarette controlled bench trials</text><line x1="80" y1="420" x2="850" y2="420" stroke="#334155"/><line x1="80" y1="100" x2="80" y2="420" stroke="#334155"/><line x1="80" y1="180" x2="850" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8"/><text x="840" y="170" text-anchor="end" fill="#fbbf24" font-family="Inter,Arial" font-size="13">Smoking threshold = 3 episodes</text><g fill="#38bdf8"><rect x="105" y="340" width="48" height="80" rx="6"/><rect x="177" y="340" width="48" height="80" rx="6"/><rect x="249" y="260" width="48" height="160" rx="6"/><rect x="321" y="260" width="48" height="160" rx="6"/><rect x="393" y="340" width="48" height="80" rx="6"/></g><g fill="#22c55e"><rect x="489" y="180" width="48" height="240" rx="6"/><rect x="561" y="180" width="48" height="240" rx="6"/><rect x="633" y="180" width="48" height="240" rx="6"/><rect x="705" y="180" width="48" height="240" rx="6"/><rect x="777" y="180" width="48" height="240" rx="6"/></g><g fill="#cbd5e1" font-family="Inter,Arial" font-size="13" text-anchor="middle"><text x="129" y="446">P1</text><text x="201" y="446">P2</text><text x="273" y="446">P3</text><text x="345" y="446">P4</text><text x="417" y="446">P5</text><text x="513" y="446">Y1</text><text x="585" y="446">Y2</text><text x="657" y="446">Y3</text><text x="729" y="446">Y4</text><text x="801" y="446">Y5</text></g><g fill="#cbd5e1" font-family="Inter,Arial" font-size="13"><text x="58" y="424">0</text><text x="58" y="344">1</text><text x="58" y="264">2</text><text x="58" y="184">3</text></g><text x="275" y="488" text-anchor="middle" fill="#38bdf8" font-family="Inter,Arial" font-size="14" font-weight="700">PAPER: 1–2 episodes</text><text x="658" y="488" text-anchor="middle" fill="#22c55e" font-family="Inter,Arial" font-size="14" font-weight="700">CIGARETTE: 3 episodes</text></svg>