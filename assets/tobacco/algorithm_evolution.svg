<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Algorithm Evolution Timeline V1.0 to V2.4</title><desc id="desc">The classifier evolved from speed threshold to pulse count, baseline recovery, valleys and rebounds, burst classification, and finally separated smoke episodes.</desc><rect width="1100" height="520" rx="24" fill="#081222"/><text x="550" y="48" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="24" font-weight="700">Algorithm Evolution Timeline</text><text x="550" y="78" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="14">Development path from V1.0 to V2.4</text><line x1="100" y1="250" x2="1000" y2="250" stroke="#334155" stroke-width="4"/><g font-family="Inter,Arial" text-anchor="middle"><g><circle cx="120" cy="250" r="20" fill="#38bdf8"/><text x="120" y="200" fill="#e8f7ff" font-size="18" font-weight="700">V1.0</text><text x="120" y="300" fill="#cbd5e1" font-size="13">Speed / rise</text><text x="120" y="320" fill="#94a3b8" font-size="12">Overlapped</text></g><g><circle cx="290" cy="250" r="20" fill="#38bdf8"/><text x="290" y="200" fill="#e8f7ff" font-size="18" font-weight="700">V2.0</text><text x="290" y="300" fill="#cbd5e1" font-size="13">Pulse counting</text><text x="290" y="320" fill="#94a3b8" font-size="12">Turbulence problem</text></g><g><circle cx="460" cy="250" r="20" fill="#38bdf8"/><text x="460" y="200" fill="#e8f7ff" font-size="18" font-weight="700">V2.1</text><text x="460" y="300" fill="#cbd5e1" font-size="13">Baseline recovery</text><text x="460" y="320" fill="#94a3b8" font-size="12">Too strict</text></g><g><circle cx="630" cy="250" r="20" fill="#38bdf8"/><text x="630" y="200" fill="#e8f7ff" font-size="18" font-weight="700">V2.2</text><text x="630" y="300" fill="#cbd5e1" font-size="13">Valleys / rebounds</text><text x="630" y="320" fill="#94a3b8" font-size="12">Still overlapping</text></g><g><circle cx="800" cy="250" r="20" fill="#f59e0b"/><text x="800" y="200" fill="#e8f7ff" font-size="18" font-weight="700">V2.3</text><text x="800" y="300" fill="#cbd5e1" font-size="13">Burst classifier</text><text x="800" y="320" fill="#fbbf24" font-size="12">FP + FN observed</text></g><g><circle cx="970" cy="250" r="24" fill="#22c55e"/><text x="970" y="195" fill="#e8f7ff" font-size="18" font-weight="700">V2.4</text><text x="970" y="300" fill="#dcfce7" font-size="13" font-weight="700">Separated episodes</text><text x="970" y="320" fill="#bbf7d0" font-size="12">Frozen classifier</text></g></g><rect x="235" y="385" width="630" height="74" rx="16" fill="#0f1e34" stroke="#334155"/><text x="550" y="415" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="14" font-weight="700">Key engineering finding</text><text x="550" y="440" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="13">Magnitude and local peak count were not reliable; independent smoke episodes performed better.</text></svg>