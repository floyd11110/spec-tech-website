<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Average Episode Count by Source</title><desc id="desc">Paper averaged 1.4 qualified episodes across five trials while cigarette trials averaged 3.0.</desc><rect width="760" height="500" rx="24" fill="#081222"/><text x="380" y="48" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="24" font-weight="700">Average Episode Count by Source</text><line x1="100" y1="410" x2="680" y2="410" stroke="#334155"/><line x1="100" y1="100" x2="100" y2="410" stroke="#334155"/><rect x="180" y="270" width="150" height="140" rx="10" fill="#38bdf8"/><rect x="430" y="110" width="150" height="300" rx="10" fill="#22c55e"/><text x="255" y="252" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="28" font-weight="700">1.4</text><text x="505" y="92" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="28" font-weight="700">3.0</text><text x="255" y="442" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="15">Paper</text><text x="505" y="442" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="15">Cigarette</text><text x="380" y="474" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="13">Initial controlled benchmark: n = 5 trials per source</text></svg>