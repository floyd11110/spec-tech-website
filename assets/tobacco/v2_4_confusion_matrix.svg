<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">V2.4 Confusion Matrix</title><desc id="desc">Five cigarette trials were correctly classified as smoking and five paper trials were correctly classified as no smoking, with zero false positives and zero false negatives.</desc><rect width="760" height="560" rx="24" fill="#081222"/><text x="380" y="48" text-anchor="middle" fill="#e8f7ff" font-family="Inter,Arial" font-size="24" font-weight="700">V2.4 Confusion Matrix</text><text x="390" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="14">Predicted class</text><text x="270" y="128" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">Smoking</text><text x="510" y="128" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">No Smoking</text><text x="45" y="285" text-anchor="middle" transform="rotate(-90 45 285)" fill="#94a3b8" font-family="Inter,Arial" font-size="14">Actual class</text><text x="115" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">Cigarette</text><text x="115" y="390" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">Paper</text><rect x="170" y="155" width="200" height="150" rx="14" fill="#14532d" stroke="#22c55e"/><rect x="410" y="155" width="200" height="150" rx="14" fill="#111827" stroke="#475569"/><rect x="170" y="335" width="200" height="150" rx="14" fill="#111827" stroke="#475569"/><rect x="410" y="335" width="200" height="150" rx="14" fill="#14532d" stroke="#22c55e"/><text x="270" y="232" text-anchor="middle" fill="#dcfce7" font-family="Inter,Arial" font-size="40" font-weight="800">5</text><text x="270" y="263" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Arial" font-size="13">True Positive</text><text x="510" y="232" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="40" font-weight="800">0</text><text x="510" y="263" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="13">False Negative</text><text x="270" y="412" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial" font-size="40" font-weight="800">0</text><text x="270" y="443" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial" font-size="13">False Positive</text><text x="510" y="412" text-anchor="middle" fill="#dcfce7" font-family="Inter,Arial" font-size="40" font-weight="800">5</text><text x="510" y="443" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Arial" font-size="13">True Negative</text><text x="380" y="525" text-anchor="middle" fill="#fbbf24" font-family="Inter,Arial" font-size="13">Observed result: 10/10 correct in this controlled bench benchmark</text></svg>